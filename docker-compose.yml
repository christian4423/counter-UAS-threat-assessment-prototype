services:
  ardupilot-sitl:
    build: .
    platform: linux/amd64
    tty: true
    environment:
      - SITL_UDP_OUTPUT_ADDRESS=udp:ingest:14550
      # Home = takeoff/landing spot SE of Little Caesars Arena, Detroit
      # (ground elevation ~183 m MSL).
      - LAT=42.33927724437817
      - LON=-83.05286810960271
      - ALT=183
      - DIR=0
    # MAVLink leaves the container (MAVProxy -> host.docker.internal:14550) and
    # replies return through Docker's NAT state, so 14550/udp is not published.
    ports:
      - 5760:5760
    depends_on: [ingest]
  ingest:
    build: ./ingest
    command: ["-listen", "0.0.0.0:14550", "-forward", "host.docker.internal:14551"]
    extra_hosts: ["host.docker.internal:host-gateway"] # Docker Desktop on a Mac doesn't need this, but Linux does, so it keeps the repo portable.

  mapserver:
    build: ./mapserver
    ports:
      # Host 8080 -> container 8000; avoids clashing with dev servers on host 8000.
      - 8080:8000
